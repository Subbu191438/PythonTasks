<!DOCTYPE html>
<html>

<head>
    <title>Update Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="form-box">

        <h1>Update Student</h1>

        <form method="POST">

            <input type="text"
                   name="name"
                   value="{{ student.name }}"
                   required>

            <button class="submit-btn">
                Update Student
            </button>

        </form>

    </div>

</body>

</html>
